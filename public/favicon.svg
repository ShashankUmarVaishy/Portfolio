<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed" />
      <stop offset="50%" stop-color="#6d28d9" />
      <stop offset="100%" stop-color="#4c1d95" />
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>
  <!-- Outer Circle Background -->
  <circle cx="256" cy="256" r="240" fill="url(#bgGrad)" />
  <!-- Inner Ring Accent -->
  <circle cx="256" cy="256" r="226" fill="none" stroke="url(#ringGrad)" stroke-width="8" opacity="0.9" />
  <!-- Monogram Text -->
  <text x="50%" y="54%" dominant-baseline="middle" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="200" fill="#ffffff" letter-spacing="-6">
    SU
  </text>
</svg>
